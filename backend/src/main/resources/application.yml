server:
  port: ${PORT:8080}
  # two people use the site: a small request pool is plenty and every idle thread costs a stack
  tomcat:
    threads:
      max: 50
      min-spare: 5
  error:
    include-message: never
  compression:
    enabled: true
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
        max-age: 30d

spring:
  application:
    name: love-site
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

app:
  # web | worker | empty (= everything in one process). Same image, two services; see README "Two services".
  role: ${APP_ROLE:}
  # loopback-only port of the render endpoint (worker / all-in-one)
  render:
    port: ${RENDER_PORT:8099}
  export:
    concurrency: ${EXPORT_CONCURRENCY:1}
    max-active-per-space: 3
    daily-limit: ${EXPORT_DAILY_LIMIT:40}
    ttl: 24h
    page-timeout: 60s
    nice: 10
    node: ${RENDER_NODE:node}
    driver: ${RENDER_DRIVER:/app/renderer/driver.mjs}
  # the app's public address, e.g. https://example.com (no path). Invite links, the default bucket CORS origin and the
  # optional redirect from *.up.railway.app derive from it.
  public-url: ${APP_PUBLIC_URL:}
  redirect-to-public-url: ${REDIRECT_TO_PUBLIC_URL:false}
  # contact address shown on the public privacy and account-deletion pages (/gizlilik, /hesap-silme); empty = gizlilik@<host
  # of APP_PUBLIC_URL). Set it to a real mailbox before the store listings go live.
  privacy:
    contact-email: ${PRIVACY_CONTACT_EMAIL:}
  # platform admin (can create spaces and invites, sees usage numbers, never content)
  admin-email: ${ADMIN_EMAIL:}
  # theme ids the API accepts (a theme itself is frontend data: frontend/src/themes/<id>)
  themes:
    default-theme: romantik
    allowed: romantik,buyulu,arkadaslar,seyahat,yilbasi,cadilar-bayrami
  space:
    initial-name: ${INITIAL_SPACE_NAME:Bizim Alanımız}
    initial-limit-gb: ${INITIAL_SPACE_LIMIT_GB:400}
    max-members: 2
    invite-ttl: 7d
    trash-retention: 30d
  seed:
    user1:
      email: ${USER1_EMAIL:}
      name: ${USER1_NAME:}
      password: ${USER1_PASSWORD:}
    user2:
      email: ${USER2_EMAIL:}
      name: ${USER2_NAME:}
      password: ${USER2_PASSWORD:}
  storage:
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:}
    access-key-id: ${S3_ACCESS_KEY_ID:}
    secret-access-key: ${S3_SECRET_ACCESS_KEY:}
    region: ${S3_REGION:auto}
    path-style: ${S3_PATH_STYLE:false}
    configure-cors: true
    # explicit HTTP limits for the bucket client
    connect-timeout: 3s
    read-timeout: 10s
    max-attempts: 3
    # defaults to the origin of APP_PUBLIC_URL
    allowed-origins: ${APP_ALLOWED_ORIGINS:${APP_PUBLIC_URL:}}
  # second S3-compatible bucket for the nightly backup (originals, album songs, daily database dump); all four of
  # endpoint / bucket / access-key-id / secret-access-key must be set, otherwise backup is off
  backup:
    endpoint: ${BACKUP_S3_ENDPOINT:}
    bucket: ${BACKUP_S3_BUCKET:}
    access-key-id: ${BACKUP_S3_ACCESS_KEY_ID:}
    secret-access-key: ${BACKUP_S3_SECRET_ACCESS_KEY:}
    region: ${BACKUP_S3_REGION:auto}
    path-style: ${BACKUP_S3_PATH_STYLE:false}
    purged-retention: 30d
    db-keep-days: 14
  processing:
    # the queue lives in this process: a poller claims one UPLOADED row at a time (FOR UPDATE SKIP LOCKED)
    auto-poll: true
    poll-interval: 3s
    concurrency: 1
    stale-after: 15m
    max-attempts: 3
    backoff: 1m,5m,15m
    photo-timeout: 60s
    video-timeout: 180s
    default-timezone: Europe/Istanbul
  media:
    max-image-size: 30MB
    max-video-size: 300MB
    max-batch-size: 50
    upload-url-ttl: 15m
    pending-ttl: 24h
