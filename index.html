<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>💕</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/EasePack.min.js"></script>
</head>
<body>
  <!-- Layer 0: animated gradient background -->
  <div id="gradientBg" aria-hidden="true"></div>

  <!-- Layer 1: bokeh particle canvas -->
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <!-- Layer 2: main scene canvas (daisy → transform → heart) -->
  <canvas id="mainCanvas" aria-hidden="true"></canvas>

  <!-- Layer 3: fx canvas (fireworks / finale) -->
  <canvas id="fxCanvas" aria-hidden="true"></canvas>

  <!-- Heart photo frames (outside uiOverlay so they don't shake) -->
  <div class="photo-wrap photo-wrap--left" id="photoLeft" aria-hidden="true">
    <div class="photo-heart">
      <img src="assets/photos/couple1.jpg" alt="Büşra &amp; Buğra" draggable="false">
    </div>
    <p class="photo-label">Büşra &amp; Buğra</p>
  </div>
  <div class="photo-wrap photo-wrap--right" id="photoRight" aria-hidden="true">
    <div class="photo-heart">
      <img src="assets/photos/couple2.jpg" alt="Büşra &amp; Buğra" draggable="false">
    </div>
    <p class="photo-label">Büşra &amp; Buğra</p>
  </div>

  <!-- Background music — plays after Evet -->
  <audio id="bgMusic" src="assets/sounds/gonul-sayfam.mp4" preload="none" loop></audio>

  <!-- Layer 4: UI overlay -->
  <div id="uiOverlay">

    <!-- Question panel: shown after heart forms -->
    <div id="questionPanel">
      <h1 id="questionText" role="heading" aria-level="1" aria-live="polite"></h1>

      <div id="buttonsArea" role="group" aria-label="Cevap seçenekleri">
        <!-- Yes button -->
        <button id="yesBtn" class="btn btn--yes" type="button" aria-label="Evet cevabını ver">
          <span class="btn__text">Evet</span>
          <div class="btn__ripple" aria-hidden="true"></div>
        </button>

        <!-- No button -->
        <button id="noBtn" class="btn btn--no" type="button" aria-label="Hayır cevabını ver">
          <span class="btn__text">Hayır</span>
          <div class="btn__ripple" aria-hidden="true"></div>
        </button>
      </div>

      <!-- Navigation to proposal page -->
      <div id="proposalNav">
        <a href="proposal.html" class="page-link page-link--proposal">
          💍 Daha büyük bir sorum var...
        </a>
      </div>
    </div>

    <!-- Final message: shown after yes -->
    <div id="finalPanel" class="hidden" aria-live="assertive">
      <div id="finalText"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
