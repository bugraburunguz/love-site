<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="landing.css" />
</head>
<body>

  <!-- 500vh scroll driver + sticky scene -->
  <div id="scrollContainer">
    <div id="stickyScene">

      <!-- Canvas world (rain → flowers → sun) -->
      <canvas id="worldCanvas" aria-hidden="true"></canvas>

      <!-- Text overlay -->
      <div id="textOverlay">

        <!-- Section 1: hero typewriter -->
        <div id="section1" class="text-section">
          <p id="heroText" class="hero-text" aria-live="polite"></p>
          <div id="heroHairline" class="hairline"></div>
        </div>

        <!-- Section 2: transition -->
        <div id="section2" class="text-section">
          <div class="t-lines">
            <p class="t-line t-line-1">Duvarlar çatladı.</p>
            <p class="t-line t-line-2">Ama çatlaklardan da ışık<br>girer.</p>
          </div>
        </div>

        <!-- Section 3: final -->
        <div id="section3" class="text-section">
          <div class="final-wrap">
            <p class="final-main">Sonra seni buldum.</p>
            <p class="final-sub">Ve dünya yeniden nefes almaya başladı.</p>
            <div class="final-cta">
              <div class="hairline-sm"></div>
              <a href="ask.html" class="cta-link">devam et →</a>
            </div>
          </div>
        </div>

      </div><!-- /textOverlay -->
    </div><!-- /stickyScene -->
  </div><!-- /scrollContainer -->

  <!-- Scroll hint -->
  <div id="scrollHint" aria-hidden="true">
    <span class="sh-text">kaydır</span>
    <div class="sh-line"></div>
  </div>

  <!-- Audio player -->
  <div id="audioPlayer" role="region" aria-label="Müzik çalar">
    <canvas id="vizCanvas" aria-hidden="true"></canvas>
    <div class="pl-inner">
      <div id="vinylDisc" class="vinyl" aria-hidden="true">
        <div class="vinyl-core"><span>♪</span></div>
      </div>
      <div class="pl-meta">
        <p class="pl-title">İhtilal</p>
        <p class="pl-artist">Ali Firu</p>
      </div>
      <button id="playBtn" class="pl-btn" aria-label="Oynat / Durdur">
        <svg id="icPlay"  viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icPause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </div>

  <audio id="bgAudio" src="assets/sounds/AliFiru - İhtilal (Official Video).mp4" preload="none"></audio>

  <script src="landing.js"></script>
</body>
</html>
